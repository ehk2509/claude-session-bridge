name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm --prefix vscode-extension run check
      - run: npm pack --dry-run


  npm-cli-package:
    name: Validate npm CLI tarball and registry name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Validate exact public package contents
        shell: bash
        run: |
          npm pack --dry-run --json > /tmp/csbridge-pack.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const files = JSON.parse(fs.readFileSync('/tmp/csbridge-pack.json','utf8'))[0].files.map(x => x.path);
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.name !== 'claude-session-bridge-cli' || p.version !== '0.2.0' || p.private ||
              p.bin?.csbridge !== './src/cli.js') throw new Error('Unexpected npm package metadata');
          for (const required of ['package.json', 'src/cli.js', 'src/core.js', 'src/recovery.js', 'README.md', 'LICENSE']) {
            if (!files.includes(required)) throw new Error('Required npm file missing: ' + required);
          }
          const forbidden = files.filter(f => f.startsWith('test/') || f.startsWith('.github/') ||
            f.startsWith('vscode-extension/') || f.includes('.env') || f.includes('secret') ||
            !['package.json','package-lock.json','README.md','LICENSE','src/cli.js','src/core.js','src/recovery.js'].includes(f));
          if (forbidden.length) throw new Error('Unexpected npm files: ' + forbidden.join(', '));
          console.log('Validated', files.length, 'npm package files');
          NODE
      - name: Smoke-test published npm CLI (only if v0.2.0 is available)
        shell: bash
        run: |
          set -euo pipefail
          if npm view claude-session-bridge-cli@0.2.0 version --json >/tmp/npm-version.json 2>/dev/null; then
            node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/npm-version.json"));if(v!=="0.2.0")process.exit(1)'
            npm view claude-session-bridge-cli@0.2.0 bin --json >/tmp/npm-bin.json
            node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync("/tmp/npm-bin.json"));if(b?.csbridge!=="src/cli.js")throw Error("Published npm CLI binary mapping is absent or unexpected");'
            dest="$(mktemp -d)"
            npm install --global --prefix "$dest" claude-session-bridge-cli@0.2.0
            "$dest/bin/csbridge" help > /tmp/csbridge-help.txt
            grep -q "Claude Session Bridge CLI v0.2.0" /tmp/csbridge-help.txt
            echo "Published npm package installs a working csbridge executable."
          else
            echo "Version 0.2.0 is not yet visible; first-publish registry availability check will decide."
          fi
      - name: Check npm registry name ownership or availability
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/csbridge-registry.json -w '%{http_code}' 'https://registry.npmjs.org/claude-session-bridge-cli')
          case "$status" in
            404) echo 'CLI-specific npm package name is available for first publication.' ;;
            200)
              node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('/tmp/csbridge-registry.json','utf8'));
          const url = typeof p.repository === 'string' ? p.repository : p.repository?.url;
          if (!url || !/github\.com[:/]ehk2509\/claude-session-bridge(?:\.git)?$/.test(url)) {
            throw new Error('npm name already occupied by a different or unverifiable project');
          }
          console.log('Existing npm package links to this GitHub repository.');
          NODE
              ;;
            *) echo "::error::npm registry availability check returned HTTP $status"; exit 1 ;;
          esac

  vscode-vsix:
    name: Package VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix vscode-extension run check
      - name: Verify VS Code Marketplace icon dimensions
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const png = fs.readFileSync('vscode-extension/media/icon.png');
          const sig = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
          if (!png.subarray(0, 8).equals(sig)) throw new Error('Extension icon is not PNG');
          const w = png.readUInt32BE(16);
          const h = png.readUInt32BE(20);
          console.log('Marketplace icon dimensions:', w, 'x', h);
          if (w !== 512 || h !== 512) throw new Error('Expected resized 512x512 icon');
          NODE
      - name: Package with official VS Code packager
        working-directory: vscode-extension
        run: npm run package:vsix
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-bridge-vscode-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error

  publish-vscode-beta:
    name: Publish VS Code v0.3.2 beta on GitHub
    # Only the reviewed main branch can publish; all 10 CI jobs must pass first.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, vscode-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release-v0.3.2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: claude-session-bridge-vscode-vsix
          path: dist
      - name: Verify VSIX package, version and contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./vscode-extension/package.json").version')"
          test "$VERSION" = "0.3.2"
          file="dist/claude-session-bridge-vscode-0.3.2.vsix"
          test -s "$file"
          test "$(find dist -maxdepth 1 -name '*.vsix' | wc -l)" -eq 1
          unzip -p "$file" extension/package.json |
            node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const p=JSON.parse(s);if(p.name!=="claude-session-bridge-vscode"||p.version!=="0.3.2"||p.publisher!=="ElyesHkiri")process.exit(1)})'
          ( cd dist && sha256sum claude-session-bridge-vscode-0.3.2.vsix > SHA256SUMS )
      - name: Create GitHub beta release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.2"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving immutable release assets."
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "::error::Tag $tag exists without a release; refusing to reuse it."
            exit 1
          fi
          gh release create "$tag" \
            dist/claude-session-bridge-vscode-0.3.2.vsix \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Claude Session Bridge v0.3.2 (VS Code beta)" \
            --notes-file docs/releases/v0.3.2.md \
            --prerelease --latest=false

  publish-npm-first:
    name: Publish CLI 0.2.0 to npm (first release)
    needs: [test, npm-cli-package]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: npm publish claude-session-bridge-cli@0.2.0 [once]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-claude-session-bridge-cli-0.2.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Verify npm bootstrap token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN secret is required for the first npm publication. Create a granular npm publish token, then add it under this repo's GitHub Actions secrets."
            exit 1
          fi
      - name: Publish reviewed CLI package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
