name: Resize Marketplace icon once

on:
  push:
    branches: [fix/marketplace-icon-512]
    paths: ['.github/workflows/resize-marketplace-icon-once.yml']

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resize the existing logo to 512px while preserving transparency
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          f = Path('vscode-extension/media/icon.png')
          with Image.open(f) as original:
              assert original.format == 'PNG', 'Only resize the expected PNG logo'
              print('Original size:', original.size)
              assert original.size == (1254, 1254), 'Unexpected logo; refusing to alter it'
              resized = original.convert('RGBA').resize((512, 512), Image.Resampling.LANCZOS)
              resized.save(f, format='PNG', optimize=True)
              print('Marketplace icon size:', resized.size, 'bytes:', f.stat().st_size)
          PY
      - name: Commit resized source icon to this PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vscode-extension/media/icon.png
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix(vscode): resize Marketplace icon to 512x512'
            git push origin HEAD:fix/marketplace-icon-512
          fi
